 <div class="row">
  <label>파일(JSON/CSV) <input type="file" id="f" accept=".json,.csv"></label>
  <label><input type="checkbox" id="auto"> 60초 자동갱신</label>

  <label><input type="checkbox" id="intonly" checked> 사진 인식은 앞 두 자리(정수)만 기록</label>
  <span id="st"></span></div>

const raf=()=>new Promise(r=>requestAnimationFrame(()=>r()));
async function makePdf(){

  const host=$("#pdfhost");
  host.innerHTML=pageHtml(title,items.map(i=>i.html).join(""),1,1,tot,true);await raf();
  const trs=[...host.querySelectorAll("table.log > tbody > tr")];
  trs.forEach((tr,i)=>{items[i].h=tr.getBoundingClientRect().height});
  const base=host.firstChild.scrollHeight-items.reduce((s,i)=>s+i.h,0);
  const AV=PAGE_H-Math.max(base,0)-6;
  const pages=[];let cur=[],h=0;
  items.forEach(it=>{
   if(cur.length&&h+it.h>AV){
    if(cur[cur.length-1].g){const gh=cur.pop();pages.push(cur);cur=[gh];h=gh.h}else{pages.push(cur);cur=[];h=0}
   }
   cur.push(it);h+=it.h});
  if(cur.length)pages.push(cur);
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
  for(let p=0;p<pages.length;p++){
   $("#pst").textContent=`PDF 만드는 중... ${p+1} / ${pages.length} 페이지`;
   host.innerHTML=pageHtml(title,pages[p].map(i=>i.html).join(""),p+1,pages.length,tot,p===pages.length-1);await raf();
   const cv=await html2canvas(host.firstChild,{scale:2,backgroundColor:"#ffffff",logging:false});
   if(p>0)pdf.addPage();
   const W=281,Hh=Math.min(194,W*cv.height/cv.width),Ww=Hh===194?194*cv.width/cv.height:W;
   pdf.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",(297-Ww)/2,8,Ww,Hh);
  }
  host.innerHTML="";
  const name="OPCM일지_"+selLabel().replace(/[ ,·\\/]+/g,"_")+"_"+(dates()[0]||"")+".pdf";
  const blob=pdf.output("blob");
  PDF={name,blob,file:new File([blob],name,{type:"application/pdf"}),url:URL.createObjectURL(blob)};
  $("#pst").textContent=`${name} (${pages.length}페이지, ${(blob.size/1024).toFixed(0)}KB) 준비 완료`;
  $("#pbt").style.display="flex";
 }catch(e){$("#pst").textContent="PDF 생성 실패: "+e.message+" (처음 한 번은 인터넷 연결이 필요할 수 있습니다)";
  $("#pbt").style.display="flex";$("#pbt").querySelectorAll("button:not(:last-child)").forEach(b=>b.style.display="none")}
}

function ingest(x,dflt){
 const put=(d,no,hz,sv)=>{if(!d||no==null)return;(DATA[d]=DATA[d]||{})[+no]={hz:(+hz).toFixed(1),save:(+sv).toFixed(1)}};
 if(Array.isArray(x))x.forEach(o=>put(o.date||dflt,o.no,o.hz??o.freq,o.save??o.saving));
 else if(x&&x.records)ingest(x.records,dflt);
 else if(x)Object.entries(x).forEach(([d,m])=>{
  if(/^\d{4}-\d{2}-\d{2}$/.test(d))Object.entries(m).forEach(([no,o])=>put(d,no,o.hz??o.freq,o.save??o.saving));
  else if(dflt)put(dflt,d,m.hz??m.freq,m.save??m.saving)});
}

/* ===== LED 7세그먼트 숫자 인식 ===== */
/* 7세그먼트(빨간 LED) 숫자 인식기: RGBA 이미지 -> 숫자열
   1) 빨간 LED 픽셀 추출  2) 숫자 단위 덩어리 찾기  3) 기울기(이탤릭)·회전 보정  4) 세그먼트 7개 점등 판독 */
function seg7Read(d,W,H){
 const N=W*H,loose=new Uint8Array(N),core=new Uint8Array(N);
 // 어두운 사진 보정: 가장 밝은 붉은 값이 낮으면 전체를 키워서 판독
 const hr=new Uint32Array(256);for(let p=0;p<d.length;p+=4)hr[d[p]]++;
 let acc=0,p995=255;for(let v=255;v>=0;v--){acc+=hr[v];if(acc>=N*0.005){p995=v;break}}
 const gain=p995<200&&p995>40?Math.min(2.2,215/p995):1;
 for(let i=0,p=0;i<N;i++,p+=4){const r=Math.min(255,d[p]*gain),g=Math.min(255,d[p+1]*gain),b=Math.min(255,d[p+2]*gain);
  if(r>95&&r-Math.max(g,b)>42&&g<0.72*r&&b<0.74*r){loose[i]=1;
   if(r>150&&g<0.42*r&&b<0.46*r&&r-Math.max(g,b)>80)core[i]=1}}
 const dil=s=>{const o=new Uint8Array(N);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x;
   if(s[i]||s[i-1]||s[i+1]||s[i-W]||s[i+W]||s[i-W-1]||s[i-W+1]||s[i+W-1]||s[i+W+1])o[i]=1}return o};
 const label=(dm)=>{const lab=new Int32Array(N),comps=[];let nl=0;const st=[];
  for(let s=0;s<N;s++){if(!dm[s]||lab[s])continue;nl++;lab[s]=nl;st.length=0;st.push(s);
   let a=0,cr=0,x0=W,x1=0,y0=H,y1=0;
   while(st.length){const i=st.pop(),x=i%W,y=(i-x)/W;
    if(loose[i]){a++;if(core[i])cr++}
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;
     if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(dm[j]&&!lab[j]){lab[j]=nl;st.push(j)}}}
   comps.push({l:nl,a,core:cr,x0,x1,y0,y1,w:x1-x0+1,h:y1-y0+1,cy:(y0+y1)/2,cx:(x0+x1)/2})}
  return{lab,comps}};
 // 소수점·단위 표시 같은 작은 점은 따로 기록해 두고 숫자 덩어리에서는 빼 둔다(숫자끼리 붙는 것을 방지)
 const L00=label(loose);let maxLED=0;
 for(const c of L00.comps)if(c.core>=0.3*c.a&&c.a>maxLED)maxLED=c.a;
 const thr=Math.max(6,0.05*maxLED),smalls=L00.comps.filter(c=>c.a<thr);
 for(let i=0;i<N;i++)if(loose[i]&&L00.comps[L00.lab[i]-1].a<thr){loose[i]=0;core[i]=0}
 // 숫자 한 칸 크기가 되도록 팽창 반경(1~4)을 바꿔 가며 '키·높이가 같은 덩어리 줄'을 찾는다
 let dm=loose,best=null;const byR={};
 for(let r=0;r<=4;r++){
  if(r>0)dm=dil(dm);
  const L=label(dm);byR[r]=L;
  const pool=L.comps.filter(c=>c.a>=8&&c.h>=6);
  if(pool.length>400||!pool.length)continue;
  for(const s of pool){
   const cl=pool.filter(c=>Math.abs(c.cy-s.cy)<=0.25*s.h&&c.h>=0.72*s.h&&c.h<=1.3*s.h&&c.w<=1.2*c.h);
   const sum=cl.reduce((q,c)=>q+c.a,0),cr=cl.reduce((q,c)=>q+c.core,0);
   if(cl.length>=2&&cr>=0.1*sum&&(!best||sum>best.sum*1.02))best={sum,cl,r}}}
 if(!best)return{ok:false,why:"no-row"};
 const {lab,comps:allC}=byR[best.r],blobs=best.cl.sort((p,q)=>p.cx-q.cx);
 const idx=new Map();blobs.forEach((b,i)=>idx.set(b.l,i));
 // 숫자에 붙어 있는 작은 점(소수점·단위 표시 막대)은 숫자 판독에서 제외
 const L0=byR[0],blobA=blobs.map(b=>b.a).sort((p,q)=>p-q),medA=blobA[Math.floor(blobA.length/2)];
 const pts=blobs.map(()=>[]);
 for(let i=0;i<N;i++)if(loose[i]){const k=idx.get(lab[i]);if(k!==undefined){const c0=L0.comps[L0.lab[i]-1];if(c0&&c0.a>=0.12*medA)pts[k].push(i%W,(i/W)|0)}}
 let mx=0,my=0,nn=0;for(const a of pts)for(let i=0;i<a.length;i+=2){mx+=a[i];my+=a[i+1];nn++}mx/=nn;my/=nn;
 const area=(th,s)=>{const c=Math.cos(th),sn=Math.sin(th);let tot=0;
  for(const a of pts){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
   for(let i=0;i<a.length;i+=2){const X=a[i]-mx,Y=a[i+1]-my,x1_=X*c-Y*sn,y_=X*sn+Y*c,x=x1_-s*y_;
    if(x<x0)x0=x;if(x>x1)x1=x;if(y_<y0)y0=y_;if(y_>y1)y1=y_}
   tot+=(x1-x0)*(y1-y0)}return tot};
 let bt=0,bs=0,bsc=1e18;
 const rng=(t0,t1,ts,s0,s1,ss)=>{for(let td=t0;td<=t1+1e-9;td+=ts){const th=td*Math.PI/180;
  for(let s=s0;s<=s1+1e-9;s+=ss){const v=area(th,s);if(v<bsc){bsc=v;bt=th;bs=s}}}};
 rng(-20,20,2,-0.4,0.4,0.05);
 {const t0=bt*180/Math.PI,s0=bs;rng(t0-2,t0+2,0.5,s0-0.05,s0+0.05,0.0125)}
 const c=Math.cos(bt),sn=Math.sin(bt);
 const T=pts.map(a=>{const X=[],Y=[];for(let i=0;i<a.length;i+=2){const x=a[i]-mx,y=a[i+1]-my,xr=x*c-y*sn,yr=x*sn+y*c;X.push(xr-bs*yr);Y.push(yr)}return{X,Y}});
 const allY=[];for(const t of T)for(const y of t.Y)allY.push(y);allY.sort((p,q)=>p-q);
 const yT=allY[Math.floor(allY.length*0.005)],yB=allY[Math.ceil(allY.length*0.995)-1],h=yB-yT;
 const MAP={"abcdef":0,"bc":1,"abdeg":2,"abcdg":3,"bcfg":4,"acdfg":5,"acdefg":6,"cdefg":6,"abc":7,"abcf":7,"abcdefg":8,"abcdfg":9,"bcdfg":9};
 const digits=[],conf=[],cxs=[];let allExact=true;
 for(const t of T){
  const xs=[...t.X].sort((p,q)=>p-q),xl=xs[Math.floor(xs.length*0.005)],xr=xs[Math.ceil(xs.length*0.995)-1],gw=xr-xl;
  cxs.push((xl+xr)/2);
  if(gw<0.34*h){digits.push(1);conf.push(1);continue}
  const fill=(fx0,fx1,fy0,fy1)=>{const ax=xl+fx0*gw,bx=xl+fx1*gw,ay=yT+fy0*h,by=yT+fy1*h;let n=0;
   for(let i=0;i<t.X.length;i++)if(t.X[i]>=ax&&t.X[i]<bx&&t.Y[i]>=ay&&t.Y[i]<by)n++;
   return n/Math.max(1,(bx-ax)*(by-ay))};
  const R={a:fill(.22,.78,0,.16),f:fill(0,.26,.12,.46),b:fill(.74,1,.12,.46),g:fill(.22,.78,.42,.58),e:fill(0,.26,.54,.88),c:fill(.74,1,.54,.88),d:fill(.22,.78,.84,1)};
  let key="";for(const k of "abcdefg")if(R[k]>0.3)key+=k;
  if(key in MAP){digits.push(MAP[key]);conf.push(1)}
  else{let bk=null,bd=9;for(const k in MAP){let dd=0;for(const s of "abcdefg")dd+=(k.includes(s)!==key.includes(s))?1:0;if(dd<bd){bd=dd;bk=k}}
   digits.push(MAP[bk]);conf.push(bd<=1?0.5:0);allExact=false}}
 // 소수점: 줄 아래쪽의 작은 점이 몇 번째 숫자 뒤에 있는지
 let dot=-1;const avgA=blobs.reduce((q,b)=>q+b.a,0)/blobs.length,bh=blobs.reduce((q,b)=>q+b.h,0)/blobs.length;
  for(const dc of smalls){
  if(dc.a<3||dc.core<0.15*dc.a)continue;
  if(dc.w>0.25*bh||dc.h>0.25*bh||dc.w>2*dc.h||dc.h>2*dc.w)continue;
  const x=dc.cx-mx,y=dc.cy-my,xr=x*c-y*sn,yr=x*sn+y*c,dx=xr-bs*yr;
  if(yr>yT+0.7*h&&yr<yB+0.3*h){let k=0;for(const cx of cxs)if(cx<dx)k++;if(k>0&&k<cxs.length){dot=k;break}}}
 const text=digits.map((v,i)=>(i===dot?".":"")+v).join("");
 const intStr=(dot>0?digits.slice(0,dot):digits.slice(0,2)).slice(0,2).join("");
 return{ok:true,digits,dot,text,int:intStr,exact:allExact,conf,n:T.length,r:best.r,theta:bt*180/Math.PI,shear:bs};
}

async function readFreq(file){
 let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(_){bmp=await createImageBitmap(file)}
 const k=Math.min(1,1000/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
 const cv=document.createElement("canvas");cv.width=w;cv.height=h;
 const cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(bmp,0,0,w,h);
 let led=null;try{led=seg7Read(cx.getImageData(0,0,w,h).data,w,h)}catch(_){}
 if(led&&led.ok&&led.exact&&led.digits.length>=2){
  const full=led.dot>0?led.text:null;
  const list=intOnly()?[led.int].concat(full?[full]:[]):(full?[full,led.int]:[led.int]);
  return{list,via:"led",raw:led.text,int:led.int};
 }
 const c=await ocr(file);            // 보조: 글자 인식(Tesseract)
 let list=c.slice();
 if(intOnly()){const ints=[...new Set(c.map(n=>String(n).split(".")[0].slice(0,2)).filter(Boolean))];list=ints.concat(c.filter(x=>String(x).includes(".")))}
 if(led&&led.ok&&led.int&&!list.includes(led.int))list.push(led.int);
 return{list:[...new Set(list)].slice(0,6),via:"ocr",raw:led&&led.ok?led.text:""};
}
let TSP;
function loadTS(){return window.Tesseract?Promise.resolve():TSP||(TSP=new Promise((ok,ng)=>{
 const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
 s.onload=ok;s.onerror=ng;document.head.appendChild(s)}))}
async function ocr(file){
 await loadTS();
 const bmp=await createImageBitmap(file),k=Math.min(1,1400/Math.max(bmp.width,bmp.height));
 const cv=document.createElement("canvas");cv.width=bmp.width*k;cv.height=bmp.height*k;
 const x=cv.getContext("2d");x.drawImage(bmp,0,0,cv.width,cv.height);
 const im=x.getImageData(0,0,cv.width,cv.height),dt=im.data;
 for(let i=0;i<dt.length;i+=4){const g=.3*dt[i]+.59*dt[i+1]+.11*dt[i+2];dt[i]=dt[i+1]=dt[i+2]=g}
 x.putImageData(im,0,0);const a=cv.toDataURL();
 for(let i=0;i<dt.length;i+=4)dt[i]=dt[i+1]=dt[i+2]=255-dt[i];
 x.putImageData(im,0,0);const b=cv.toDataURL();
 const w=await Tesseract.createWorker("eng");
 await w.setParameters({tessedit_char_whitelist:"0123456789.",tessedit_pageseg_mode:"11"});
 let txt="";for(const u of [a,b]){txt+=" "+(await w.recognize(u)).data.text}
 await w.terminate();
 const m=[...new Set((txt.match(/\d{1,3}(\.\d{1,2})?/g)||[]))].filter(n=>+n>0&&+n<=120);
 m.sort((p,q)=>(/\./.test(q)-/\./.test(p)));return m.slice(0,6);
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,finalTxt="";
function openRem(){
 if(RB){$("#rt0").textContent=`선택 설비 ${RB.length}개 · 비고 일괄 적용`;$("#rt").value=""}
 else{const r=R.find(x=>x[0]===curR);$("#rt0").textContent=`No.${curR} ${r[3]} · 비고`;$("#rt").value=getRem(curR)}
 $("#rs").textContent=SR?"":"이 기기에서는 음성인식이 지원되지 않습니다. 키보드의 마이크(받아쓰기)를 사용하세요.";
 if(!$("#rdlg").open)$("#rdlg").showModal();
}
function toggleMic(){
 if(!SR){$("#rs").textContent="이 기기에서는 음성인식이 지원되지 않습니다. 키보드의 마이크(받아쓰기)를 사용하세요.";return}
 if(listening){rec.stop();return}
 rec=new SR();rec.lang="ko-KR";rec.interimResults=true;rec.continuous=true;
 rec.onstart=()=>{listening=true;finalTxt=$("#rt").value;$("#mic").classList.add("live");$("#mic").textContent="⏹ 중지";$("#rs").textContent="듣는 중... 말씀하세요"};
 rec.onresult=e=>{let interim="";
  for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;
   if(e.results[i].isFinal)finalTxt+=(finalTxt&&!/\s$/.test(finalTxt)?" ":"")+t.trim();else interim+=t}
  $("#rt").value=finalTxt+(interim?(finalTxt?" ":"")+interim:"")};
 rec.onerror=e=>{$("#rs").textContent="음성인식 오류: "+e.error+(e.error==="not-allowed"?" (마이크 권한을 허용하세요)":"")};
 rec.onend=()=>{listening=false;$("#mic").classList.remove("live");$("#mic").textContent="🎤 음성입력";
  if($("#rs").textContent.startsWith("듣는 중"))$("#rs").textContent=""};
 try{rec.start()}catch(_){}
}
$("#rt").addEventListener("input",()=>{if(listening)finalTxt=$("#rt").value});
function stopMic(){try{if(listening&&rec)rec.stop()}catch(_){}}
function saveRem(){stopMic();
 const t=$("#rt").value.trim(),w=wk();REM[w]=REM[w]||{};
 if(RB&&!t){alert("비고 내용을 입력하세요");return}
 (RB||[curR]).forEach(n=>{REM[w][n]=t});
 persistRem();$("#rdlg").close();RB=null;render()}
function clearRem(){stopMic();
 if(RB&&!confirm(`선택한 설비 ${RB.length}개의 비고를 삭제할까요?`))return;
 const w=wk();(RB||[curR]).forEach(n=>{REM[w]=REM[w]||{};REM[w][n]=""});
 persistRem();$("#rdlg").close();RB=null;render()}
function closeRem(){stopMic();$("#rdlg").close();RB=null}

/* ===== 홈 화면 설치(PWA) ===== */
let DEFP=null;
const isStd=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFP=e});
addEventListener("appinstalled",()=>{DEFP=null;const b=document.getElementById("instb");if(b)b.style.display="none"});
if(isStd()){const b=document.getElementById("instb");if(b)b.style.display="none"}
async function showInstall(){
 if(DEFP){DEFP.prompt();try{await DEFP.userChoice}catch(_){}DEFP=null;return}
 const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
 const box=document.getElementById("ibody");
 box.innerHTML=ios
  ?'<b>아이폰/아이패드 (Safari 필수)</b><ol style="margin:6px 0 0;padding-left:20px"><li>Safari로 이 주소를 엽니다 (카카오톡·네이버 앱 내 브라우저는 불가)</li><li>하단 <b>공유 버튼(□↑)</b> 누르기</li><li><b>「홈 화면에 추가」</b> 선택</li><li>이름 확인 후 우측 상단 <b>「추가」</b></li></ol>'
  :'<b>안드로이드 (Chrome 권장)</b><ol style="margin:6px 0 0;padding-left:20px"><li>Chrome으로 이 주소를 엽니다</li><li>우측 상단 <b>⋮ 메뉴</b> 누르기</li><li><b>「홈 화면에 추가」</b> 또는 <b>「앱 설치」</b> 선택</li><li>확인을 누르면 홈 화면에 아이콘이 생깁니다</li></ol>';
 document.getElementById("idlg").showModal()}

initDates();chips();render();sync();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
